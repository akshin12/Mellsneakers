<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mellsneakers</title>
<style>
  body {
    margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #0b1a0f; color: #c5e1a5;
  }
  header {
    background: #143d15; padding: 10px 20px; display: flex; align-items: center;
  }
  header img {
    height: 40px; margin-right: 15px;
  }
  header h1 {
    margin: 0; font-weight: 700;
  }
  nav {
    margin-left: auto;
  }
  nav button {
    background: transparent; border: 1px solid #a6d785; color: #a6d785;
    padding: 5px 10px; margin-left: 10px; cursor: pointer; border-radius: 4px;
  }
  nav button:hover {
    background: #a6d785; color: #0b1a0f;
  }
  main {
    max-width: 1000px; margin: 20px auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;
  }
  .card {
    background: #1e3a1b; padding: 15px; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center;
  }
  .card img {
    width: 180px; border-radius: 8px; margin-bottom: 10px;
  }
  .card h3 {
    margin: 5px 0; color: #d0f0b0;
  }
  .card p {
    font-size: 14px; color: #b2d492; margin: 0 0 10px;
  }
  .card button {
    background: #5aa23a; border: none; padding: 8px 15px; border-radius: 5px;
    color: #0b1a0f; font-weight: bold; cursor: pointer;
  }
  .card button:hover {
    background: #a6d785;
  }
  #cartModal {
    display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.7); justify-content: center; align-items: center;
  }
  #cartContent {
    background: #1e3a1b; padding: 20px; border-radius: 10px; width: 90%; max-width: 400px;
    color: #d0f0b0; max-height: 80vh; overflow-y: auto;
  }
  #cartContent h2 {
    margin-top: 0;
  }
  #cartContent ul {
    list-style: none; padding: 0;
  }
  #cartContent li {
    margin: 10px 0; display: flex; justify-content: space-between;
  }
  #cartContent button {
    background: #a6d785; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;
  }
  #closeCart {
    float: right; background: #5a7f29; border: none; color: #0b1a0f;
    font-weight: bold; padding: 3px 8px; border-radius: 3px; cursor: pointer;
  }
  #closeCart:hover {
    background: #a6d785;
  }
  footer {
    text-align: center; padding: 10px 0; color: #6b8e23; background: #0b1a0f; margin-top: 40px;
    font-size: 14px;
  }
</style>
</head>
<body>

<header>
  <img src="https://img.icons8.com/ios-filled/50/8bc34a/boar.png" alt="Логотип кабан" />
  <h1>Mellsneakers</h1>
  <nav>
    <button id="openCartBtn">Корзина (0)</button>
  </nav>
</header>

<main id="productList">
  <!-- Товары вставятся сюда через JS -->
</main>

<!-- Модальное окно корзины -->
<div id="cartModal">
  <div id="cartContent">
    <button id="closeCart">Закрыть</button>
    <h2>Корзина</h2>
    <ul id="cartItems"></ul>
    <p id="totalPrice">Итого: 0 ₽</p>
    <button id="checkoutBtn">Оплатить через Тинькофф</button>
  </div>
</div>

<script>
  const products = [
    {id:1, name:"Mellsneakers Alpha", price:1990, desc:"Лёгкие кроссовки для бега", img:"https://via.placeholder.com/180?text=Alpha"},
    {id:2, name:"Mellsneakers Beta", price:1590, desc:"Удобные для города", img:"https://via.placeholder.com/180?text=Beta"},
    {id:3, name:"Mellsneakers Gamma", price:1990, desc:"Для активного отдыха", img:"https://via.placeholder.com/180?text=Gamma"},
    {id:4, name:"Mellsneakers Delta", price:990, desc:"Стильные и лёгкие", img:"https://via.placeholder.com/180?text=Delta"},
    {id:5, name:"Mellsneakers Omega", price:1990, desc:"Премиум качество", img:"https://via.placeholder.com/180?text=Omega"}
  ];

  const productList = document.getElementById('productList');
  const cartModal = document.getElementById('cartModal');
  const cartItemsEl = document.getElementById('cartItems');
  const openCartBtn = document.getElementById('openCartBtn');
  const closeCartBtn = document.getElementById('closeCart');
  const totalPriceEl = document.getElementById('totalPrice');
  const checkoutBtn = document.getElementById('checkoutBtn');

  let cart = [];

  function renderProducts() {
    productList.innerHTML = '';
    products.forEach(p => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <img src="${p.img}" alt="${p.name}" />
        <h3>${p.name}</h3>
        <p>${p.desc}</p>
        <p><b>${p.price} ₽</b></p>
        <button data-id="${p.id}">Добавить в корзину</button>
      `;
      productList.appendChild(card);
    });
  }

  function renderCart() {
    cartItemsEl.innerHTML = '';
    if(cart.length === 0) {
      cartItemsEl.innerHTML = '<li>Корзина пуста</li>';
      totalPriceEl.textContent = 'Итого: 0 ₽';
      openCartBtn.textContent = 'Корзина (0)';
      checkoutBtn.disabled = true;
      return;
    }
    let total = 0;
    cart.forEach(item => {
      total += item.price * item.quantity;
      const li = document.createElement('li');
      li.innerHTML = `
        ${item.name} × ${item.quantity} — ${item.price * item.quantity} ₽ 
        <button data-id="${item.id}">❌</button>
      `;
      cartItemsEl.appendChild(li);
    });
    totalPriceEl.textContent = 'Итого: ' + total + ' ₽';
    openCartBtn.textContent = 'Корзина (' + cart.reduce((sum, i) => sum + i.quantity, 0) + ')';
    checkoutBtn.disabled = false;
  }

  function addToCart(id) {
    const product = products.find(p => p.id === id);
    if(!product) return;
    const cartItem = cart.find(i => i.id === id);
    if(cartItem) {
      cartItem.quantity++;
    } else {
      cart.push({...product, quantity: 1});
    }
    renderCart();
  }

  function removeFromCart(id) {
    cart = cart.filter(i => i.id !== id);
    renderCart();
  }

  productList.addEventListener('click', e => {
    if(e.target.tagName === 'BUTTON') {
      const id = +e.target.dataset.id;
      addToCart(id);
    }
  });

  cartItemsEl.addEventListener('click', e => {
    if(e.target.tagName === 'BUTTON') {
      const id = +e.target.dataset.id;
      removeFromCart(id);
    }
  });

  openCartBtn.addEventListener('click', () => {
    cartModal.style.display = 'flex';
  });

  closeCartBtn.addEventListener('click', () => {
    cartModal.style.display = 'none';
  });

  checkoutBtn.addEventListener('click', () => {
    if(cart.length === 0) return alert('Корзина пуста');
